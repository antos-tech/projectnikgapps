name: Build NikGapps (fork)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-pip python3-venv aapt git git-lfs apktool
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          python3 -m venv ~/venv && . ~/venv/bin/activate
          pip install -r requirements.txt
          python -m NikGapps.main --androidVersion 17 --packageList full --packageSource git
          find / -name "nikgapps*.zip" 2>/dev/null
